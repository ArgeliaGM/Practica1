<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD-11-1 Uso de Bootstrap</title>

  <!-- Tarea 1: enlace CDN de Bootstrap (CSS) en el encabezado -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <!-- Tarea 2: contenedor de ancho variable (fluid) que contiene todo el contenido -->
  <div class="container-fluid">

    <!-- Tarea 3: tres botones de colores diferentes -->
    <div class="my-3">
      <button type="button" class="btn btn-primary">Primario</button>
      <button type="button" class="btn btn-success">Éxito</button>
      <button type="button" class="btn btn-warning">Advertencia</button>
    </div>

    <!-- Tarea 4: alineación de texto con utilidades (sin variantes responsivas, siempre fijas) -->
    <p class="text-start">Izquierda</p>
    <p class="text-center text-danger">Centro</p>
    <p class="text-end">Derecha</p>

    <!-- Tarea 5: tarjeta con encabezado, imagen y grupo de lista -->
    <div class="card" style="width: 18rem;">
      <div class="card-header">Hoja de ruta</div>
      <img src="fruit-basket.svg" class="card-img-top" alt="Cesta de frutas">
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Manzana</li>
        <li class="list-group-item">Naranja</li>
        <li class="list-group-item">Plátano</li>
      </ul>
    </div>

  </div>

  <!-- Tarea 1: enlace CDN de Bootstrap (JS) debajo del contenido del cuerpo -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
